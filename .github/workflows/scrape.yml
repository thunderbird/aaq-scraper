name: Refresh SUMO AAQ

# Hourly incremental refresh: re-scrape only the day-CSVs whose questions or
# answers changed since the last run (run_refresh.py, high-water-mark mode).
# This also covers newly-created questions (their `updated` >= creation), so it
# replaces the old daily created-based scrape. Manual runs may pass an explicit
# date range. run_backfill.py + the per-day scrapers remain for bulk backfills.

on:
  schedule:
    - cron: "0 * * * *" # hourly, on the hour (UTC)
  workflow_dispatch:
    inputs:
      start_date:
        description: "Explicit refresh start YYYY-MM-DD (UTC). Blank = incremental."
        required: false
      end_date:
        description: "Explicit refresh end YYYY-MM-DD (UTC). Default: same as start."
        required: false

permissions:
  contents: write

# Newest run wins: an hourly refresh that's still going when the next one fires
# is cancelled in favour of the fresh run. Safe because the refresh is idempotent
# and the high-water mark only advances on a clean run, so a cancelled run loses
# nothing (the replacement re-queries the same window). Avoids stale/piled-up
# runs; paired with timeout-minutes as a hard duration cap.
concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Hard backstop above run_refresh's --soft-deadline (40 min): the refresh
    # stops taking new days at 40 min and exits cleanly with the high-water mark
    # advanced over whatever finished, so this cap should rarely fire. It only
    # guards against a hang below the deadline check (e.g. a stuck browser). Keep
    # it > the soft deadline and < the hourly interval so cancel-in-progress still
    # bounds a truly stuck run.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        # Full history so the "Commit results" rebase-onto-latest-main can always
        # find the merge base when another pusher (local backfill / a prior
        # refresh) advanced main after checkout.
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Sync dependencies
        run: uv sync

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      # Rolling state: restore the most recent high-water mark, save a fresh
      # cache each run (keys are immutable, so the run id makes a new entry that
      # restore-keys picks up next time). Absent on first run -> run_refresh.py
      # falls back to its lookback window.
      #
      # `.refresh-hwm` lives in GitHub's cache storage (not the repo/runner).
      # Cache = best-effort: 10 GB/repo, LRU, evicted after 7 days idle; the
      # hourly cron keeps it warm and the 26h lookback makes any miss self-heal.
      # Scoped to main (where the cron runs), so each run reads the prior one.
      # Inspect: `gh cache list`. See CLAUDE.md "Automation" for details.
      - name: Restore refresh high-water mark
        if: ${{ !github.event.inputs.start_date }}
        uses: actions/cache/restore@v4
        with:
          path: .refresh-hwm
          key: refresh-hwm-${{ github.run_id }}
          restore-keys: |
            refresh-hwm-

      - name: Refresh changed days
        run: |
          set -euo pipefail
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          if [ -n "$START" ]; then
            # Manual explicit-range catch-up: run to completion (no deferral).
            uv run python run_refresh.py "$START" ${END:+"$END"}
          else
            # Hourly incremental: defer long 429 waits and stop at the soft
            # deadline so the run ends cleanly and the mark advances over what
            # finished (deferred days are retried next run — no spiral).
            uv run python run_refresh.py --soft-deadline 40 --max-429-wait 120
          fi

      - name: Save refresh high-water mark
        if: ${{ success() && !github.event.inputs.start_date }}
        uses: actions/cache/save@v4
        with:
          path: .refresh-hwm
          key: refresh-hwm-${{ github.run_id }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 20*/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Hourly refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # main also receives pushes from the local backfill and overlapping
          # refresh runs, so the remote can advance between checkout and push.
          # Rebase onto the latest main and retry with backoff rather than
          # failing on a rejected ("fetch first") push.
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "rebase failed (attempt $attempt/5); retrying"
              sleep $((attempt * 5))
              continue
            fi
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt/5); retrying"
            sleep $((attempt * 5))
          done
          echo "ERROR: could not push after 5 attempts"
          exit 1
