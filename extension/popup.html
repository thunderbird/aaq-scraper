<!DOCTYPE html>

     file, You can obtain one at https://mozilla.org/MPL/2.0/. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    .sub { color: #666; margin: 0 0 10px; font-size: 11px; }
    label { display: block; margin: 8px 0 2px; font-weight: 600; }
    select, input[type="text"] { width: 100%; box-sizing: border-box; padding: 4px; }
    input[type="text"]:invalid { border-color: #b60205; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .check { margin-top: 10px; font-weight: 400; display: flex; align-items: center; gap: 6px; }
    button { margin-top: 12px; width: 100%; padding: 8px; font-size: 13px; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.6; }
    #status { margin-top: 10px; white-space: pre-wrap; font-size: 12px; min-height: 1em; }
    #status.err { color: #b60205; }
    #status.ok { color: #0e8a16; }
  </style>
</head>
<body>
  <h1>SUMO AAQ fetcher</h1>
  <p class="sub">Run on an open support.mozilla.org tab. Downloads a raw-JSON
    bundle for <code>import_json.py</code>.</p>

  <label for="product">Product</label>
  <select id="product"></select>

  <!-- Text inputs, not type="date": Firefox's native calendar panel is taller
       than the auto-sized popup and its top rows get clipped behind the popup.
       Typing YYYY-MM-DD is robust and identical in both browsers. -->
  <div class="row">
    <div>
      <label for="start">Start (UTC)</label>
      <input type="text" id="start" inputmode="numeric" maxlength="10"
             placeholder="YYYY-MM-DD" pattern="\d{4}-\d{2}-\d{2}"
             title="YYYY-MM-DD">
    </div>
    <div>
      <label for="end">End (UTC)</label>
      <input type="text" id="end" inputmode="numeric" maxlength="10"
             placeholder="YYYY-MM-DD" pattern="\d{4}-\d{2}-\d{2}"
             title="YYYY-MM-DD">
    </div>
  </div>

  <label class="check"><input type="checkbox" id="answers" checked> Fetch answers too</label>

  <button id="fetch">Fetch &amp; download</button>
  <div id="status"></div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
